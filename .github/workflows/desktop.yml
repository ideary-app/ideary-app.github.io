name: Desktop app (Windows)
# Builds the Windows installer whenever something in desktop/ changes on main, and publishes it as
# the GitHub release "desktop-v<version>" (version from desktop/src-tauri/tauri.conf.json).
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri -> target" }
      - name: Install CLI and make icons
        working-directory: desktop
        run: |
          npm install
          npx tauri icon icon.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: "Ideary desktop v__VERSION__"
          releaseBody: "Windows installer for Ideary desktop."
          releaseDraft: false
          prerelease: false
