name: tests
on: [push, pull_request]
jobs:
  claude-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tests/claude-bridge.test.js
