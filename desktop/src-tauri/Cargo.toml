[package]
name = "ideary"
version = "0.3.1"
description = "Ideary desktop"
edition = "2021"

[lib]
name = "ideary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
open = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
